type UserAccess @model @auth(rules: [{allow: public}]) {
  id: ID!

  user_id: ID! @index
  tenant_id: ID! @index

  permissions: String
  status: Boolean

  user: User @belongsTo(fields: ["user_id"])
  tenant: Tenant @belongsTo(fields: ["tenant_id"])
}

type MetricsType @model @auth(rules: [{allow: public}]) {
  id: ID!
  name: String
  min_value: Float
  max_value: Float
  category: String
  client_id: String
}

type LocalPlan @model @auth(rules: [{allow: public}]) {
  id: ID!
  type: String
  clases: Int
  price: Float
  client_id: String
}

type Student @model @auth(rules: [{allow: public, operations: [create, read, update, delete]}]) {
  id: ID!
  user_id: Int
  name: String
  address: String
  age: Int
  phone: String
  birthday: AWSDate
  email: String
  image: String
  client_id: String
}

type Pay @model @auth(rules: [{allow: public, operations: [create, read, update, delete]}]) {
  id: ID!
  composite_key: String
  user_id: Int
  amount: Float
  clases: Int
  type: String
  date: AWSDate
  client_id: String
  prof_id: String
}

type Metric @model @auth(rules: [{allow: public, operations: [create, read, update, delete]}]) {
  id: ID!
  user_id: Int
  metric: String
  date: AWSDate
  value: Float
  client_id: String
  prof_id: String
}

type Attendance @model @auth(rules: [{allow: public, operations: [create, read, update, delete]}]) {
  id: ID!
  user_id: Int
  name: String
  date: AWSDate
  client_id: String
  prof_id: String
}

type User @model @auth(rules: [{allow: public, operations: [create, read, update, delete]}]) {
  user_id: ID! @primaryKey
  name: String!
  access: [UserAccess] @hasMany(fields: ["user_id"])
}

type AppPlan @model @auth(rules: [{allow: public, operations: [create, read, update, delete]}]) {
  id: ID!
  name: String
  price: Float
}

type Tenant @model @auth(rules: [{allow: public}]) {
  tenant_id: ID! @primaryKey
  name: String!
  status: Boolean
  plan: String
  who_access: [UserAccess] @hasMany(fields: ["tenant_id"])
}
 